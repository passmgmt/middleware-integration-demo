name: CI

on:
  push:
  pull_request:

jobs:
  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [producer, consumer]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build service
        run: mvn --batch-mode --no-transfer-progress verify

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kafka compose file
        run: docker compose -f kafka/docker-compose.yaml config